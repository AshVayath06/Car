<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moving Car</title>
    <style>
        .car{
            font-size: 100px;
            position: relative;
            animation: move 4s linear infinite;
        }
        @keyframes move{
            from{
                right:0
            }
            to{
                right: 400px;
            }
        }
    </style>
</head>
<body>
    <div class="car">🚗</div>
    
</body>
</html>
